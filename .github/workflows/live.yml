name: Live contract tests

# The sources can change their formats without notice. These tests talk to the real services once a week (and on
# demand) so that a change is noticed before users do.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run test:live
